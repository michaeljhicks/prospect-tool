<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Iceworks | Discovery Portal Moved</title>
<style>
:root{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#073247;background:#f2f5f3}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{max-width:580px;background:white;border-top:6px solid #087c91;padding:28px 35px;box-shadow:0 7px 28px #07324716}
h1{font-size:25px;line-height:1.25;margin:0 0 10px}p{margin:10px 0}a{color:#087c91;font-weight:700;overflow-wrap:anywhere}small{color:#516b76}
</style>
</head>
<body>
<main>
<h1>Iceworks Discovery has moved</h1>
<p>The Iceworks Franchise Discovery Portal is now hosted at <strong>discover.iceworksus.com</strong>.</p>
<p>If you are not automatically redirected, <a id="continue" href="https://discover.iceworksus.com/">continue to the Iceworks Discovery Portal</a>.</p>
<noscript><p>JavaScript is required to preserve your personalized invitation access. Please use a browser with JavaScript enabled, or contact Iceworks for a fresh invitation.</p></noscript>
<small>Iceworks Franchise Group</small>
</main>
<script>
// Redirect-only repository. No invitation tokens are read, parsed, stored or logged.
// URL fragments are preserved by the browser and are not transmitted to GitHub.
(function () {
  'use strict';
  const allowed = new Set(['index.html', 'capital-readiness.html', 'capital-admin.html', 'capital-privacy.html', 'invitation-expired.html']);
  let filename = location.pathname.split('/').pop() || 'index.html';
  if (!allowed.has(filename)) filename = 'index.html';
  const target = new URL('https://discover.iceworksus.com/' + filename);
  target.search = location.search;
  target.hash = location.hash;
  document.getElementById('continue').href = target.href;
  location.replace(target.href);
})();
</script>
</body>
</html>
