name: Capital chart regression tests

on:
  push:
    branches:
      - "feature/iceworks-chartjs-step5"
      - "feature/capital-recovery-review-integration"
      - main
  pull_request:
    paths:
      - "capital-chart.js"
      - "capital-recovery-review.js"
      - "capital-readiness.html"
      - "index.html"
      - "numbers-reference-config.js"
      - "capital-privacy.html"
      - "tests/capital-chart.test.cjs"
      - ".github/workflows/chart-tests.yml"

permissions:
  contents: read

jobs:
  chart-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse Chart.js controller
        run: node --check capital-chart.js
      - name: Run cost, accessibility and fallback regression tests
        run: node --test tests/capital-chart.test.cjs
      - name: Install browser smoke-test runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Run headless Chromium and mobile smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/iceworks-static.log 2>&1 &
          sleep 2
          node tests/capital-chart.browser.cjs
      - name: Save visual smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capital-chart-smoke
          path: |
            chart-desktop-smoke.png
            chart-mobile-smoke.png
          if-no-files-found: ignore
